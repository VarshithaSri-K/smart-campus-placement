{% extends "base.html" %}
{% block title %}Register - CampusPlace{% endblock %}
{% block content %}
<div class="auth-wrapper">
  <div class="auth-card" style="max-width:560px">
    <h2 class="mt-0">Create your student account</h2>
    <p class="sub">Fill in your academic details — you can add skills after signing up.</p>
    <div id="alert-box"></div>
    <form id="register-form">
      <div class="form-row">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="name" required>
        </div>
        <div class="form-group">
          <label>Roll Number</label>
          <input type="text" id="roll_no" required>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" required>
        </div>
        <div class="form-group">
          <label>Phone</label>
          <input type="text" id="phone">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Branch</label>
          <select id="branch" required></select>
        </div>
        <div class="form-group">
          <label>Batch Year</label>
          <input type="number" id="batch_year" min="2020" max="2035" value="2026" required>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>CGPA (0-10)</label>
          <input type="number" id="cgpa" step="0.01" min="0" max="10" required>
        </div>
        <div class="form-group">
          <label>Active Backlogs</label>
          <input type="number" id="backlogs" min="0" value="0">
        </div>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" required minlength="6">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%">Create Account</button>
    </form>
    <p class="muted" style="margin-top:18px">
      Already registered? <a href="/login">Sign in</a>
    </p>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
{% endblock %}
