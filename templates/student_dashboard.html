{% extends "base.html" %}
{% block title %}My Dashboard - CampusPlace{% endblock %}
{% block content %}
<div class="container">
  <div class="tabs">
    <button class="tab-btn active" data-tab="profile">My Profile</button>
    <button class="tab-btn" data-tab="recommend">Recommended Jobs</button>
    <button class="tab-btn" data-tab="applications">My Applications</button>
  </div>

  <div id="alert-box"></div>

  <div class="tab-panel active" id="panel-profile">
    <div class="grid-2">
      <div class="card">
        <div class="card-title-row"><h3>Academic Profile</h3></div>
        <form id="profile-form">
          <div class="form-group"><label>Full Name</label><input type="text" id="p-name"></div>
          <div class="form-row">
            <div class="form-group"><label>Branch</label><select id="p-branch"></select></div>
            <div class="form-group"><label>CGPA</label><input type="number" id="p-cgpa" step="0.01" min="0" max="10"></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label>Backlogs</label><input type="number" id="p-backlogs" min="0"></div>
            <div class="form-group"><label>Phone</label><input type="text" id="p-phone"></div>
          </div>
          <div class="form-group"><label>Resume Link (Drive/Dropbox URL)</label><input type="url" id="p-resume"></div>
          <button type="submit" class="btn btn-primary">Save Changes</button>
        </form>
      </div>

      <div class="card">
        <div class="card-title-row"><h3>My Skills</h3></div>
        <form id="skill-form" style="display:flex; gap:8px; margin-bottom:14px;">
          <input type="text" id="skill-name" placeholder="e.g. Python" style="flex:2">
          <select id="skill-level" style="flex:1">
            <option value="1">Beginner</option>
            <option value="2" selected>Intermediate</option>
            <option value="3">Advanced</option>
          </select>
          <button type="submit" class="btn btn-primary btn-sm">Add</button>
        </form>
        <div id="skills-list"></div>
      </div>
    </div>
  </div>

  <div class="tab-panel" id="panel-recommend">
    <p class="muted">Ranked by our skill-matching algorithm, based on your profile and skills.</p>
    <div id="recommend-list"></div>
  </div>

  <div class="tab-panel" id="panel-applications">
    <div id="applications-list"></div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/student.js') }}"></script>
{% endblock %}
