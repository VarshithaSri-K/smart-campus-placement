version: "3.9"

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: campus_placement
      MYSQL_USER: placement_user
      MYSQL_PASSWORD: placement_pass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpass"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SECRET_KEY: change-this-to-a-long-random-secret-key
      DATABASE_URL: mysql+pymysql://placement_user:placement_pass@db:3306/campus_placement
      ADMIN_EMAIL: admin@campus.edu
      ADMIN_PASSWORD: Admin@123
      ADMIN_NAME: Placement Officer
      PORT: 5000
    ports:
      - "5000:5000"

volumes:
  db_data:
